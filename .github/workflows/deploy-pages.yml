name: Deploy Shinylive App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.cache/R/library
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Create cache directories
        run: |
          mkdir -p "${R_LIBS_USER}"
          mkdir -p "${XDG_CACHE_HOME}/R"
          mkdir -p "${XDG_CACHE_HOME}/shinylive"

      - name: Cache R packages and shinylive assets
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.R_LIBS_USER }}
            ${{ env.XDG_CACHE_HOME }}/R
            ${{ env.XDG_CACHE_HOME }}/shinylive
          key: ${{ runner.os }}-r-4.5-shinylive-${{ hashFiles('.github/workflows/deploy-pages.yml', 'scripts/export_shinylive.R') }}
          restore-keys: |
            ${{ runner.os }}-r-4.5-shinylive-

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          use-public-rspm: true
          extra-packages: |
            any::shiny
            any::shinylive
            any::bslib
            any::shinybusy
            any::DT
            any::survival
            any::survminer
            any::ggplot2
            any::ggplotify
            any::patchwork
            any::dplyr
            any::readr
            any::readxl
            any::writexl
            any::glue

      - name: Export Shinylive site
        run: Rscript scripts/export_shinylive.R

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
